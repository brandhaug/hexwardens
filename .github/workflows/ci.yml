name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Generated infrastructure and operation guards
        run: |
          node infra/write-wrangler.ts --check
          node --test infra/operations.test.ts infra/backup.test.ts
          node scripts/check-shared-d1.ts

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Dead-code regression check
        run: pnpm run dead-code

      - name: Typecheck (TypeScript + Effect diagnostics)
        run: pnpm run typecheck

  test-build:
    name: Unit tests & production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Unit tests
        run: pnpm run test

      - name: Production build
        run: pnpm run build

      - name: Storybook build
        run: pnpm -C apps/web run build-storybook

  e2e:
    name: E2E smoke tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: apps/web
        run: pnpm exec playwright install-deps chromium

      - name: Run E2E smoke tests
        working-directory: apps/web
        env:
          BETTER_AUTH_SECRET: ci-smoke-better-auth-secret-placeholder-00
          BETTER_AUTH_URL: http://localhost:3001
          AUTH_JWT_SECRET: ci-smoke-auth-jwt-secret-placeholder-0000000
          GAME_SERVER_URL: http://localhost:8787
        run: pnpm run test:e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blob-report-${{ matrix.shard }}
          path: apps/web/blob-report
          retention-days: 1

  e2e-report:
    name: Merge E2E reports
    if: ${{ !cancelled() }}
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: apps/web/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML report
        working-directory: apps/web
        run: pnpm exec playwright merge-reports --reporter=html ./all-blob-reports

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  ci:
    name: CI gate
    if: ${{ always() }}
    needs: [lint, test-build, e2e, e2e-report]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check
        env:
          LINT: ${{ needs.lint.result }}
          TEST_BUILD: ${{ needs.test-build.result }}
          E2E: ${{ needs.e2e.result }}
          REPORT: ${{ needs.e2e-report.result }}
        run: |
          test "$LINT" = success
          test "$TEST_BUILD" = success
          test "$E2E" = success
          test "$REPORT" = success
