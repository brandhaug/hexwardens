name: Deploy
on:
  workflow_run:
    workflows: [CI, Audit]
    types: [completed]
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      ALCHEMY_STAGE: prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Require CI and Audit on this exact default-branch head
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          head="$(git rev-parse HEAD)"
          current="$(gh api "repos/$REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)"
          test "$head" = "$current"
          for workflow in ci.yml audit.yml; do
            result="$(gh api "repos/$REPOSITORY/actions/workflows/$workflow/runs?head_sha=$head&event=push&per_page=1" --jq '.workflow_runs[0].conclusion')"
            test "$result" = success
          done
      - uses: ./.github/actions/setup
      - name: Resolve deployment origins
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          GAME_SERVER_URL: ${{ vars.GAME_SERVER_URL }}
        run: node .github/scripts/deployment.ts urls
      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_TRUSTED_ORIGINS: ${{ vars.BETTER_AUTH_TRUSTED_ORIGINS }}
          ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN }}
        run: node scripts/alchemy-stage.ts deploy --stage=prod --confirm-target="$CLOUDFLARE_ACCOUNT_ID/prod"
      - name: Smoke test production
        run: node .github/scripts/deployment.ts smoke
